name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint (pyflakes)
        run: ruff check cpanelpwn tests cPanelpwn.py

      - name: Lint PT-BR (AGENTS.md)
        run: |
          if grep -rnE "Ejecut|Creando|Agregando|Recopil|Escriba|LLAMADOR|canónico|canónica|Perfiles|Provando|sensibles" \
               cpanelpwn/ tests/ README.md; then
            echo "Violações de idioma PT-BR encontradas"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all modules
        run: |
          python -m py_compile cPanelpwn.py cpanelpwn/*.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Smoke test — version + help + catálogo de CVEs
        run: |
          python cPanelpwn.py --no-banner --no-cve-feed --no-update-check --version
          python cPanelpwn.py --no-banner -h > /dev/null
          python cPanelpwn.py --no-banner --no-color --list-cves > /dev/null
