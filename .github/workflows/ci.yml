name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all modules
        run: |
          python -m py_compile cPanelpwn.py cpanelpwn/*.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Smoke test — version + help
        run: |
          python cPanelpwn.py --no-banner --no-cve-feed --no-update-check --version
          python cPanelpwn.py --no-banner -h > /dev/null